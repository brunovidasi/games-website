<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Theft Auto · Bruno's Games</title>
<meta name="description" content="Bruno's Grand Theft Auto collection: every game on every platform I have it on, and the versions still to find.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/orbitron-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/exo2-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/cases.css">
<link rel="stylesheet" href="css/collection.css">
<link rel="stylesheet" href="css/gta.css">
</head>
<body class="collection gta">

<div class="topbar">
  <a class="brand" href="./">Bruno's <span>Games</span></a>
  <nav class="topnav" aria-label="Pages">
    <a href="./">The Shelf</a>
    <a href="sims.html">The Sims</a>
    <a href="gta.html" aria-current="page">GTA</a>
  </nav>
</div>

<div id="shell"></div>

<div class="tools">
  <div class="grp" id="modeWrap">
    <span class="lbl">Show</span>
    <div class="pills" id="mode" role="group" aria-label="How the cases stand">
      <button type="button" data-m="mixed">One cover per game</button>
      <button type="button" data-m="spines">All spines</button>
      <button type="button" data-m="covers">All covers</button>
    </div>
  </div>
  <div class="grp">
    <span class="lbl">Covers</span>
    <div class="pills" id="covers" role="group" aria-label="Filter by cover">
      <button type="button" data-cv="">All</button>
      <button type="button" data-cv="with">Scanned <em id="cv-with"></em></button>
      <button type="button" data-cv="without">Still to find <em id="cv-without"></em></button>
    </div>
  </div>
</div>

<main class="case-wrap"><div class="bookcase" id="case"></div></main>
<section id="checklist" aria-label="Checklist"></section>

<footer>
  Every Grand Theft Auto I have, on every platform. The checklist shows the versions still to find. Release dates are the first release on each platform.
</footer>

<script src="js/consoles.js"></script>
<script src="js/console-art.js"></script>
<script src="js/cases.js"></script>
<script src="js/collection.js"></script>
<script src="js/gta.js"></script>
<script src="js/app.js"></script>
</body>
</html>
