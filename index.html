<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bruno's Games</title>
<meta name="description" content="Bruno's video game collection, on the shelf.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/cases.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="./">Bruno's <span>Games</span></a>
  <nav class="toplinks">
    <a class="opt" href="prototypes/index.html">Design prototypes</a>
    <a href="https://brunovida.si/music" target="_blank" rel="noopener">Records ↗</a>
  </nav>
</div>

<div id="shell"></div>

<div class="tools">
  <span class="lbl">Show</span>
  <div class="pills" id="mode" role="group" aria-label="How the cases stand">
    <button data-m="mixed">One cover per console</button>
    <button data-m="spines">All spines</button>
    <button data-m="covers">All covers</button>
  </div>
  <span class="lbl">Covers</span>
  <div class="pills" id="covers" role="group" aria-label="Filter by cover">
    <button data-cv="">All</button>
    <button data-cv="with">Scanned <em id="cv-with"></em></button>
    <button data-cv="without">Still to find <em id="cv-without"></em></button>
  </div>
</div>

<main class="case-wrap"><div class="bookcase" id="case"></div></main>

<footer>
  Cover scans from <a href="https://github.com/libretro-thumbnails" target="_blank" rel="noopener">libretro-thumbnails</a>,
  <a href="https://github.com/aldostools/resources" target="_blank" rel="noopener">aldostools/resources</a> (PS3) and
  <a href="https://github.com/xlenore/ps2-covers" target="_blank" rel="noopener">xlenore/ps2-covers</a> (PS2).
  Release dates are the first release on each console.
</footer>

<script src="js/consoles.js"></script>
<script src="js/cases.js"></script>
<script src="js/app.js"></script>
</body>
</html>
